  <style>
  /* 1. Typing Animation (Premium Resume) */
  .typing-target {
    display: inline-block;
    overflow: hidden;
    white-space: nowrap;
    border-right: 4px solid #31694f;
    width: 0;
    max-width: fit-content;
    animation: typing 5s steps(20, end) infinite, blink-caret .75s step-end infinite;
  }

  @keyframes typing {
    0%, 10% { width: 0 }
    50%, 80% { width: 100% }
    100% { width: 0 }
  }

  @keyframes blink-caret {
    from, to { border-color: transparent }
    50% { border-color: #31694f }
  }

  /* 2. Nav Buttons Smooth Animation */
  .nav-btn-smooth {
    position: relative;
    transition: all 0.3s ease;
    border-bottom: 2px solid transparent;
  }
  .nav-btn-smooth:hover {
    color: #31694f !important;
    transform: translateY(-2px);
  }
  .nav-btn-smooth::after {
    content: '';
    position: absolute;
    width: 0;
    height: 2px;
    bottom: -2px;
    left: 0;
    background-color: #31694f;
    transition: width 0.3s ease;
  }
  .nav-btn-smooth:hover::after {
    width: 100%;
  }

  /* 3. Pulse Animation (Mobile-Friendly) */
  .pulse-button {
    animation: pulse-ring 2s infinite !important; /* Force enable on mobile */
    transition: transform 0.3s ease;
  }

  @keyframes pulse-ring {
    0% { box-shadow: 0 0 0 0 rgba(49, 105, 79, 0.4); }
    70% { box-shadow: 0 0 0 15px rgba(49, 105, 79, 0); }
    100% { box-shadow: 0 0 0 0 rgba(49, 105, 79, 0); }
  }

  .pulse-button:active {
    transform: scale(0.95);
  }
  /* Select Button Animation */
  .select-btn-animate {
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    position: relative;
    overflow: hidden;
  }

  .select-btn-animate:hover {
    transform: translateY(-3px); /* லேசாக மேலே தூக்கும் */
    box-shadow: 0 8px 15px rgba(49, 105, 79, 0.3);
    filter: brightness(1.1); /* லேசாக வெளிச்சமாகும் */
  }

  .select-btn-animate:active {
    transform: translateY(0); /* கிளிக் செய்யும் போது அழுத்தும் உணர்வு */
  }
</style>
